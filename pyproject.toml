[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypha"
version = "0.1.0"
description = "An agentic literature-based discovery engine that surfaces novel, testable, cross-domain hypotheses from the scientific literature."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hypha" }]
keywords = [
    "literature-based-discovery",
    "hypothesis-generation",
    "agentic-ai",
    "research",
    "openalex",
    "swanson-linking",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hypha = "hypha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hypha = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
